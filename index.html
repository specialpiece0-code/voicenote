<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#03C75A">
  <title>보이스노트</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <main id="main"><!-- ui.js 렌더링 --></main>
  </div>
  <nav id="bottom-nav" aria-label="주 메뉴">

    <button id="nav-record" aria-label="녹음">●</button>
    <button id="nav-settings" class="nav-btn" aria-label="설정">⚙️<span>설정</span></button>
  </nav>
  <input type="file" id="file-input" accept=".mp3,.m4a,.aac,.wav,.webm,.ogg,audio/*" hidden>
  <input type="file" id="restore-input" accept=".json,application/json" hidden>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script src="js/db.js"></script>
  <script src="js/recorder.js"></script>
  <script src="js/stt.js"></script>
  <script src="js/whisper.js"></script>
  <script src="js/summarizer.js"></script>
  <script src="js/exporter.js"></script>
  <script src="js/diarize.js"></script>
  <script src="js/gauth.js"></script>
  <script src="js/gcal.js"></script>
  <script src="js/drive.js"></script>
  <script src="js/transcribe.js"></script>
  <script src="js/player.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
